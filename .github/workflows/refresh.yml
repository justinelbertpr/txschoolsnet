# Refreshes the site from TEA data (or rebuilds from the committed snapshot)
# and deploys it. Two triggers, two jobs:
#
#   push to main       every merge rebuilds from whatever snapshot is already
#                      committed under data/raw/ and deploys it — no fetch,
#                      no new commit. This is what makes "merged to main" and
#                      "live on txschools.net" the same event.
#
#   workflow_dispatch  the annual path, run by hand (optionally with fetch
#                      turned on to pull fresh TEA and Census street snapshots
#                      first). NOT on
#                      a schedule — see the design doc: GitHub disables
#                      scheduled workflows in public repos after 60 days
#                      without repository activity, and this only runs about
#                      once a year, so a cron can't keep itself alive. A
#                      calendar reminder is the human backstop for that one.
#
# Both paths share every step below; `inputs.fetch` is simply unset (falsy)
# on a push trigger, so the fetch-and-commit steps only ever run from a
# manual dispatch. The bot's own commit-and-push during a fetch run will
# itself re-trigger this workflow on push — harmless: the second run finds
# nothing new to fetch and just redeploys the snapshot the first run already
# committed.
name: Refresh and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fetch:
        description: 'Fetch fresh TEA and Census street snapshots (off = rebuild committed data)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fetch TEA and Census address snapshots
        if: inputs.fetch
        run: npm run fetch && npm run fetch:addresses

      - name: Build, export, prerender
        run: npm run site

      - name: Verify the site's published claims
        run: npm test

      - name: Check asset file count
        run: node scripts/check-file-count.mjs

      - name: Commit new snapshot
        if: inputs.fetch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/ data/addresses/
          git diff --staged --quiet || git commit -m "Add TEA snapshot $(cat build/snapshot.txt)"
          git push

      # site/style.css and site/app.js are hand-authored and heavily commented —
      # real design documentation, not boilerplate — so that is what git keeps,
      # and what `npm run site`/`npm run preview` serve to a developer working
      # locally. This step overwrites this runner's on-disk copies only, in
      # place, with an esbuild-minified rewrite (comments and whitespace
      # stripped, syntax untouched — safe for the modern CSS this stylesheet
      # uses: @supports selector(), color-mix(), oklch(), :has()) — right
      # before the deploy steps below read ./site to build what actually ships.
      # Nothing here is committed: the step above already pushed anything worth
      # keeping, `git add` is never called again after this point, and the
      # runner's checkout is discarded when the job ends. A rerun of this exact
      # job always starts from the readable, git-committed source again.
      - name: Minify CSS/JS for deploy (runner copy only — never committed)
        run: npm run minify

      # `versions upload` uploads a new version of a Worker that already exists; it
      # cannot create one. The first run of this workflow therefore failed with
      # "You cannot upload a new version of a Worker that does not yet exist."
      #
      # The upload -> smoke-test -> promote dance exists to protect a live site
      # during a cutover. On a first deploy there is no live site to protect, so
      # bootstrapping with `deploy` is correct rather than a shortcut, and every
      # subsequent run takes the safe path.
      - name: Does the Worker already exist?
        id: exists
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deployments list

      - name: First deploy — create the Worker and bind the domain
        if: steps.exists.outcome == 'failure'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Upload a new version
        id: upload
        if: steps.exists.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Required when the token can see more than one Cloudflare account:
          # `versions upload` otherwise fails non-interactively with
          # "More than one account available". Kept in secrets rather than
          # wrangler.jsonc because this repository is public.
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: versions upload --tag ci-${{ github.run_number }}

      - name: Smoke-test the preview before cutover
        if: steps.exists.outcome == 'success'
        run: |
          URL="${{ steps.upload.outputs.deployment-url }}"
          test -n "$URL" || { echo "no preview URL — check preview_urls in wrangler.jsonc"; exit 1; }

          # Entity URLs are /<level>/<name slug>-<id>, and TEA renames districts
          # and campuses between snapshots, so the slug is read out of the build
          # this job is about to deploy rather than typed in here. The ids are
          # what is pinned: they are TEA's own and they do not churn. If an id
          # stops resolving to exactly one page, the URL scheme or the data
          # changed and the job fails here instead of shipping.
          slug_for () {
            local level="$1" id="$2"
            local matches=(site/"$level"/*-"$id".html)
            if [ "${#matches[@]}" -ne 1 ] || [ ! -f "${matches[0]}" ]; then
              echo "expected exactly one site/$level page for id $id, got: ${matches[*]}" >&2
              return 1
            fi
            basename "${matches[0]}" .html
          }
          district_page=$(slug_for district 109901) || exit 1    # Abbott ISD
          campus_page=$(slug_for campus 057905001) || exit 1     # a Dallas ISD campus
          echo "resolved /district/$district_page and /campus/$campus_page"

          # A 200 alone does not prove the right bytes came back — a misrouted
          # deploy that answers every request with one page would pass a status
          # check — so each URL also has to contain something only that page
          # says. Entity pages are matched on their own canonical URL.
          expect_ok () {
            local path="$1" needle="$2" code
            code=$(curl -sS -o /tmp/smoke.html -w '%{http_code}' "$URL$path")
            echo "$path -> $code"
            [ "$code" = "200" ] || return 1
            grep -qF "$needle" /tmp/smoke.html || { echo "  body did not contain: $needle" >&2; return 1; }
          }
          expect_ok / 'Texas school ratings' || exit 1
          expect_ok /about 'not affiliated with the Texas Education Agency' || exit 1
          expect_ok /download 'entities.csv' || exit 1
          expect_ok /districts/a 'Texas school districts starting with A' || exit 1
          expect_ok /region/10 'txschools.net/region/10' || exit 1
          expect_ok /county/dallas 'Dallas County' || exit 1
          expect_ok "/district/$district_page" "txschools.net/district/$district_page" || exit 1
          expect_ok "/campus/$campus_page" "txschools.net/campus/$campus_page" || exit 1

          # The check above is only worth running if a wrong URL can still fail.
          # wrangler.jsonc sets not_found_handling to "404-page"; if a future
          # change makes everything answer 200, every assertion above becomes
          # decoration and this catches it.
          missing=$(curl -s -o /dev/null -w '%{http_code}' "$URL/district/no-such-district-000000")
          echo "/district/no-such-district-000000 -> $missing (expected 404)"
          [ "$missing" = "404" ] || { echo "an unknown URL did not 404 — the smoke test above proves nothing"; exit 1; }

          # The content-hashed payload is the one asset whose filename plus
          # `immutable` caching makes a bad deploy effectively permanent — a
          # wrong payload would be cached for a year (design §10). Check its
          # status AND that the served byte count matches what we built, not
          # just that something answered 200.
          payload=$(cat build/payload-name.txt)
          expected=$(wc -c < "site/data/$payload" | tr -d ' ')
          got_code=$(curl -s -o /tmp/payload.json -w '%{http_code}' "$URL/data/$payload")
          echo "/data/$payload -> $got_code"
          [ "$got_code" = "200" ] || exit 1
          got_bytes=$(wc -c < /tmp/payload.json | tr -d ' ')
          echo "expected $expected bytes, got $got_bytes bytes"
          [ "$got_bytes" = "$expected" ] || exit 1

      - name: Promote to production
        if: steps.exists.outcome == 'success'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `versions deploy --yes` selects NOTHING. The command is interactive by
          # design and --yes only skips the confirmation, not the choice, so every
          # run uploaded a version, smoke-tested it, and then promoted zero:
          # "You must select at least 1 version to deploy."
          #
          # The upload step above tags each version ci-<run_number>, so name that
          # tag here. --version-tag resolves it to a version id against the
          # deployable versions, which keeps promotion tied to the exact artefact
          # this run built and smoke-tested rather than to whatever is newest.
          command: versions deploy --version-tag ci-${{ github.run_number }} --yes

      # A first deploy publishes immediately, so there is no preview to test —
      # but that is the run most worth verifying, not least.
      - name: Verify the live site after a first deploy
        if: steps.exists.outcome == 'failure'
        run: |
          echo "Waiting for the custom domain to answer..."
          for i in $(seq 1 30); do
            code=$(curl -sS -o /tmp/live.html -w '%{http_code}' https://txschools.net/ || echo 000)
            [ "$code" = "200" ] && break
            sleep 10
          done
          echo "https://txschools.net/ -> $code"
          [ "$code" = "200" ] || { echo "the apex is not serving"; exit 1; }
          grep -q "Texas school accountability" /tmp/live.html || {
            echo "the apex answered but did not return the home page"; exit 1; }
          echo "Live."
